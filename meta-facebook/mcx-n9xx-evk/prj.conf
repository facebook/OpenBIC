# Full board port: console + shell + real common/ subsystems (wdt,
# I2C, sensor framework, FRU/eeprom) ported to mainline Zephyr.
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=99
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_HWINFO_SHELL=y
CONFIG_WATCHDOG=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_MBOX=y
CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_I2C_TARGET=y
# cmsis-os2 (used by common/lib/timer.c and common/hal/hal_wdt.c's
# wdt_thread) - CMSIS_RTOS_V2 itself depends on these
CONFIG_POLL=y
CONFIG_NUM_PREEMPT_PRIORITIES=56
CONFIG_CMSIS_RTOS_V2=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192
