# Minimal bring-up: console + shell + a GPIO heartbeat, nothing from
# OpenBIC's common/ sensor/IPMI/FRU pipeline (see CMakeLists.txt).
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=99
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_HWINFO_SHELL=y
CONFIG_WATCHDOG=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
