# Board-specific config for the cpu0 app, applied to EVERY build of this
# target (single-core and sysbuild alike).
#
# NOTE: CONFIG_SECOND_CORE_MCUX is deliberately NOT set here. It makes
# cpu0's SoC init release cpu1 from reset pointing at slot1_partition;
# with no cpu1 image there (the normal single-core build) cpu1
# wild-branches through blank flash and wedges the system before the
# console is up. It is now set from sysbuild.cmake, scoped to the
# dual-core `west build --sysbuild` build where a cpu1 image actually
# exists.
